[project]
name = "flamenco-frame-analysis"
version = "0.1.0"
description = "Hybrid RAG + LLM pipeline for flamenco periodical frame analysis"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
retrieval = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8.0",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true